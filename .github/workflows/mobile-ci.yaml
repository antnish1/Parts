name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yaml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yaml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
