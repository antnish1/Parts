name: Build Android AAB Locally on GitHub
on:
  push:
    branches:
      - feature/android-native-branding-push-startup-20261024
    paths:
      - '.github/workflows/android-local-aab.yaml'
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_FROZEN_LOCKFILE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies / create blue assets
        working-directory: mobile
        run: npm install
      - name: Verify Android source
        working-directory: mobile
        run: npm run check
      - name: Build signed Android AAB locally
        working-directory: mobile
        run: eas build --platform android --profile production --local --non-interactive --output parts-connect-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: parts-connect-native-blue-logo-aab
          path: mobile/parts-connect-release.aab
          if-no-files-found: error
