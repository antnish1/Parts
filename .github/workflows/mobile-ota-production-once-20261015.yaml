name: One-time Android Production OTA 2026-10-15

on:
  push:
    branches:
      - agent/one-time-production-ota-20261015
    paths:
      - '.github/workflows/mobile-ota-production-once-20261015.yaml'

concurrency:
  group: parts-connect-android-production-ota-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish latest mobile commit to production OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ubkwtjyvbdvepzbxoikq.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_L-SrVLzVHoSt9OKGAu1eTQ_UslGY7m3
      EXPO_PUBLIC_APP_ENV: production

    steps:
      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing repository secret EXPO_TOKEN."
            exit 1
          fi

      - name: Checkout latest mobile branch
        uses: actions/checkout@v5
        with:
          ref: agent/expo-android-foundation

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Validate mobile bundle
        working-directory: mobile
        run: npm run check

      - name: Publish Android production OTA
        working-directory: mobile
        env:
          UPDATE_MESSAGE: One-time production OTA for latest Parts Connect mobile fixes
        run: |
          eas update --channel production --platform android --message "${UPDATE_MESSAGE}" --non-interactive
