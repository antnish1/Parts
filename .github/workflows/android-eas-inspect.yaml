name: Inspect Failed Expo Android Build
on:
  push:
    branches:
      - feature/android-native-branding-push-startup-20261024
    paths:
      - '.github/workflows/android-eas-inspect.yaml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install project dependencies for EAS CLI inspection
        working-directory: mobile
        run: npm install
      - name: Inspect EAS failed build
        working-directory: mobile
        shell: bash
        run: |
          EXPO_DEBUG=1 eas build:view 2b256f73-8cc2-41c5-91a2-8a29c3738ffd --json > /tmp/build.json
          node -e "const b=require('/tmp/build.json'); console.log(JSON.stringify({status:b.status,error:b.error,logs:b.logs,logFiles:b.logFiles,buildLogsUrl:b.buildLogsUrl},null,2))"
