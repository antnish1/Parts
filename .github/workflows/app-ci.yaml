name: App CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Notification contract tests
        run: npx vitest run src/services/notificationDelivery.contract.test.ts
        working-directory: app
