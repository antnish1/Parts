name: App CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --silent
        working-directory: app
      - name: Run build
        shell: bash
        run: |
          npm run build > /tmp/app-build.log 2>&1 || { tail -n 80 /tmp/app-build.log; exit 1; }
          tail -n 20 /tmp/app-build.log
        working-directory: app
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-diagnostics-2
          path: /tmp/app-build.log
          retention-days: 1
